# Include this file inside an existing server {} block.
# Publish the application upstream on the same host's loopback port 18080.
location = /auto {
    return 308 /auto/;
}

location /auto/ {
    # The trailing slash strips /auto/ for the application's root routes.
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    # Preserve the external host AND port for the WebSocket Origin check.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
